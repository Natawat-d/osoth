services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # internal-only: no published port; app reaches it as host "mongo"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: "/osoth"
    image: osoth-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3100:3000"   # localhost only; nginx proxies /osoth -> here
    depends_on:
      - mongo

volumes:
  mongo_data:

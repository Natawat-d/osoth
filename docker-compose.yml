services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # internal-only: no published port; app reaches it as host "mongo"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # internal-only: pub/sub ระหว่าง app → socket

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ""       # เสิร์ฟที่ root โดเมน https://osoth.com
    image: osoth-app
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_BASE_PATH: ""         # must match build arg or next start serves 404s
    ports:
      - "127.0.0.1:3100:3000"   # localhost only; Caddy proxies osoth.com -> here
    depends_on:
      - mongo
      - redis

  socket:
    image: osoth-app            # ใช้ image เดียวกัน (มี scripts/socket-server.mjs)
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379"
      SOCKET_PORT: "3000"
      SOCKET_PATH: "/socket.io"         # ให้ตรง path ที่ client ต่อ (root domain)
    command: ["node", "scripts/socket-server.mjs"]
    ports:
      - "127.0.0.1:3102:3000"   # Caddy: /socket.io -> 127.0.0.1:3102
    depends_on:
      - redis

volumes:
  mongo_data:
